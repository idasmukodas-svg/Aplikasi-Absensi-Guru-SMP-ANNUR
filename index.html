      <div class="mb-3">
        <label class="block text-xs font-medium text-slate-600 mb-1">Pilih Nama Guru</label>
        <select id="select-guru" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-slate-50 focus:ring-2 focus:ring-emerald-500 outline-none">
          <option value="">-- Memuat Daftar Guru... --</option>
        </select>
      </div>
      <div class="text-xs bg-slate-50 p-2 rounded border border-slate-200 flex justify-between items-center">
        <span class="text-slate-500">Device ID:</span>
        <span id="device-id-display" class="font-mono text-slate-700 font-semibold">Generating...</span>
      </div>
    </div>

    <!-- Card GPS Check -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Lokasi Terkini (GPS)</h2>
      <div class="flex items-center justify-between text-xs mb-2">
        <div>
          <p id="geo-status" class="text-slate-600">Mengecek koordinat GPS...</p>
          <p id="geo-distance" class="font-bold text-slate-800 mt-0.5">-</p>
        </div>
        <button onclick="getLokasi()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-3 py-2 rounded-lg border border-slate-300 font-medium transition">
          Refresh GPS
        </button>
      </div>
    </div>

    <!-- Scanner Box -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-center">
      <h2 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">Scan QR Absensi</h2>
      
      <div id="reader" class="overflow-hidden rounded-lg bg-black text-white min-h-[220px] flex items-center justify-center">
        <span class="text-xs text-slate-400">Kamera belum aktif</span>
      </div>

      <div class="mt-4 flex gap-2">
        <button id="btn-start" onclick="startScanner()" class="flex-1 bg-emerald-700 hover:bg-emerald-800 text-white font-medium text-sm py-2.5 rounded-lg shadow-sm transition">
          Buka Kamera
        </button>
        <button id="btn-stop" onclick="stopScanner()" class="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-medium text-sm py-2.5 rounded-lg transition hidden">
          Tutup Kamera
        </button>
      </div>
    </div>

    <!-- Status Output -->
    <div id="alert-box" class="p-3 rounded-lg text-xs font-medium text-center hidden"></div>

  </main>
